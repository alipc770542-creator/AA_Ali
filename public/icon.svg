<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#673AB7"/>
      <stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Movie clapper & animation sparkle -->
  <g transform="translate(96, 110)">
    <!-- Slate board body -->
    <rect x="20" y="90" width="280" height="200" rx="20" fill="#1e1e2f" stroke="#ffffff" stroke-width="8"/>
    <!-- Screen inside slate -->
    <rect x="40" y="110" width="240" height="130" rx="10" fill="#2d1b4e"/>
    <!-- Cartoon face in screen -->
    <circle cx="160" cy="175" r="45" fill="#FFCC80"/>
    <circle cx="145" cy="168" r="6" fill="#333"/>
    <circle cx="175" cy="168" r="6" fill="#333"/>
    <path d="M 148 190 Q 160 205 172 190" stroke="#E65100" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="137" cy="180" rx="6" ry="4" fill="#FF8A80" opacity="0.7"/>
    <ellipse cx="183" cy="180" rx="6" ry="4" fill="#FF8A80" opacity="0.7"/>
    <!-- Clapper top stick -->
    <g transform="rotate(-15 20 90)">
      <rect x="15" y="45" width="290" height="42" rx="8" fill="#1e1e2f" stroke="#ffffff" stroke-width="6"/>
      <!-- Diagonal stripes -->
      <polygon points="50,45 80,45 60,87 30,87" fill="#ffffff"/>
      <polygon points="110,45 140,45 120,87 90,87" fill="#ffffff"/>
      <polygon points="170,45 200,45 180,87 150,87" fill="#ffffff"/>
      <polygon points="230,45 260,45 240,87 210,87" fill="#ffffff"/>
    </g>
    <!-- Play symbol -->
    <polygon points="150,250 150,274 174,262" fill="#00E676"/>
  </g>
  <!-- Magic sparkle star -->
  <path d="M 400 90 L 412 120 L 442 132 L 412 144 L 400 174 L 388 144 L 358 132 L 388 120 Z" fill="url(#star)"/>
  <path d="M 100 370 L 108 390 L 128 398 L 108 406 L 100 426 L 92 406 L 72 398 L 92 390 Z" fill="url(#star)"/>
</svg>
